<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Alpha Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;
  --border:#e4e8ed;--border2:#d0d5dd;
  --text:#0d1117;--text2:#3d4a56;--text3:#8a96a3;--text4:#b0bac4;
  --cyan:#00b4d8;--cyan-bg:#e8f8fc;
  --red:#e03e3e;--red-bg:#fef0f0;
  --green:#0da86a;--green-bg:#edfaf3;
  --gold:#d4870f;--gold-bg:#fef6e7;
  --purple:#6b4fbb;--purple-bg:#f2effc;
  --orange:#d9601a;--orange-bg:#fef3ec;
  --navy:#1d4ed8;--navy-bg:#eff4ff;
  --sans:'Sora',sans-serif;
  --serif:'Playfair Display',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 2px 8px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.07);
  --r:14px;--rsm:8px;--rpill:100px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:56px;padding:0 16px;display:flex;align-items:center;gap:12px}
.logo-wrap{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#0d1117,#1e2a35);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo-alpha{font-weight:700;font-size:1.1rem;color:var(--text);letter-spacing:-.01em}
.logo-ops{font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--cyan)}
.hsearch{flex:1;min-width:0;position:relative}
.hsearch input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rpill);padding:7px 14px 7px 34px;font-family:var(--sans);font-size:.82rem;color:var(--text);outline:none;transition:border-color .15s}
.hsearch input:focus{border-color:var(--cyan);background:#fff}
.hsearch input::placeholder{color:var(--text4)}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text4);font-size:.82rem;pointer-events:none}
.hactions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ibtn{width:32px;height:32px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;color:var(--text2);transition:all .15s;user-select:none}
.ibtn:hover{background:var(--bg);border-color:var(--border2)}

/* ── SYSTEM OVERVIEW STRIP ── */
.sysbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.sysbar-item{display:flex;flex-direction:column;align-items:center;padding:6px 4px;position:relative}
.sysbar-item:not(:last-child)::after{content:'';position:absolute;right:0;top:20%;height:60%;width:1px;background:var(--border)}
.sys-val{font-family:var(--mono);font-size:1.1rem;font-weight:700;line-height:1;margin-bottom:3px}
.sys-lbl{font-family:var(--mono);font-size:.55rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text4)}

/* ── TABS ── */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;padding:11px 16px;font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:color .15s;flex-shrink:0}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tbadge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:var(--rpill);font-size:.58rem;font-weight:700;padding:0 4px;background:var(--cyan);color:#fff}
.tab:nth-child(2) .tbadge{background:var(--purple)}
.tab:nth-child(3) .tbadge{background:var(--red)}
.tab:nth-child(4) .tbadge{background:var(--gold)}

/* ── ANALYST BAR ── */
.abar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 0}
.abar-lbl{font-family:var(--mono);font-size:.56rem;font-weight:500;letter-spacing:.1em;color:var(--text4);text-transform:uppercase;padding:0 16px;margin-bottom:8px}
.abar-scroll{display:flex;gap:9px;padding:2px 16px;overflow-x:auto;scrollbar-width:none}
.abar-scroll::-webkit-scrollbar{display:none}
.av-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0}
.av{width:50px;height:50px;border-radius:50%;border:2.5px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;transition:border-color .15s,box-shadow .15s}
.av.active{border-width:2.5px}
.av-name{font-family:var(--sans);font-size:.58rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text2)}
.av-cnt{font-family:var(--mono);font-size:.58rem;color:var(--text4);margin-top:-2px}

/* ── FEED ── */
.feed{max-width:600px;margin:0 auto;padding:14px 12px 56px}

/* ── SIGNAL CARD ── */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);border-left:4px solid transparent;padding:15px;margin-bottom:11px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;animation:cin .3s ease both}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.ctop{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.cav{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.cmeta{flex:1;min-width:0}
.cmeta-top{display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap}
.cname{font-weight:700;font-size:.85rem}
.cpill{font-size:.6rem;font-weight:600;letter-spacing:.05em;padding:2px 8px;border-radius:var(--rpill);text-transform:uppercase}
.pill-signal{background:rgba(0,180,216,.12);color:var(--cyan)}
.pill-alert{background:rgba(224,62,62,.12);color:var(--red)}
.pill-opportunity{background:rgba(13,168,106,.12);color:var(--green)}
.pill-breakthrough{background:rgba(107,79,187,.12);color:var(--purple)}
.cdomain{font-size:.72rem;color:var(--text3)}
.ctime{font-size:.67rem;color:var(--text4);margin-left:auto;font-family:var(--mono);flex-shrink:0}
.cbody{font-size:.91rem;line-height:1.65;color:var(--text);margin-bottom:11px}
.cfoot{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cbar-wrap{display:flex;align-items:center;gap:5px}
.cbar{width:78px;height:4px;background:var(--border);border-radius:var(--rpill);overflow:hidden}
.cfill{height:100%;border-radius:var(--rpill)}
.cpct{font-family:var(--mono);font-size:.68rem;font-weight:600}
.csrc{font-size:.68rem;color:var(--text4)}
.ctags{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tag{font-size:.6rem;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:var(--rpill);padding:2px 7px}

/* ── GRID CARD ── */
.gcard{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);animation:cin .3s ease both}
.gcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.gcard-entity{display:flex;align-items:center;gap:7px;min-width:0}
.gcard-type{font-family:var(--mono);font-size:.58rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;flex-shrink:0}
.gcard-val{font-weight:700;font-size:.95rem;color:var(--text);text-transform:capitalize}
.gcard-score{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--purple);flex-shrink:0}
.gcard-analysts{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.gchip{font-family:var(--mono);font-size:.58rem;font-weight:600;padding:2px 8px;border-radius:var(--rpill);border:1.5px solid}
.gcard-signals{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.gsig{font-size:.77rem;line-height:1.5;color:var(--text3);padding:6px 9px;background:var(--bg);border-radius:var(--rsm);border-left:3px solid var(--border2)}
.gcard-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gcard-stat{font-family:var(--mono);font-size:.6rem;color:var(--text4)}
.sev-pill{font-family:var(--mono);font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:var(--rpill);text-transform:uppercase}
.sev-LOW{background:rgba(13,168,106,.1);color:var(--green)}
.sev-MEDIUM{background:rgba(212,135,15,.12);color:var(--gold)}
.sev-HIGH{background:rgba(224,62,62,.12);color:var(--red)}
.sev-CRITICAL{background:rgba(107,79,187,.12);color:var(--purple)}
.etype-countries{background:rgba(29,78,216,.1);color:var(--navy)}
.etype-regions{background:rgba(8,145,178,.1);color:var(--cyan)}
.etype-sectors{background:rgba(13,168,106,.1);color:var(--green)}
.etype-commodities{background:rgba(212,135,15,.12);color:var(--gold)}
.etype-event_types{background:rgba(224,62,62,.1);color:var(--red)}
.etype-companies{background:rgba(107,79,187,.1);color:var(--purple)}
.etype-asset_classes{background:rgba(217,96,26,.1);color:var(--orange)}

/* ── PRESSURE CARD ── */
.pzone{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:11px;box-shadow:var(--shadow);animation:cin .3s ease both}
.pzone-bar{height:5px}
.heat-CRITICAL{background:linear-gradient(90deg,#9333ea,#e03e3e)}
.heat-HIGH{background:linear-gradient(90deg,#e03e3e,#d4870f)}
.heat-ELEVATED{background:linear-gradient(90deg,#d4870f,#0da86a)}
.heat-MONITORING{background:linear-gradient(90deg,#0da86a,#00b4d8)}
.pzone-body{padding:14px}
.pzone-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:10px}
.pzone-geo{font-weight:700;font-size:1.05rem;color:var(--text);text-transform:capitalize}
.pzone-sub{font-size:.73rem;color:var(--text3);margin-top:2px}
.heat-pill{font-family:var(--mono);font-size:.6rem;font-weight:700;padding:3px 9px;border-radius:var(--rpill);text-transform:uppercase;flex-shrink:0}
.hp-CRITICAL{background:rgba(147,51,234,.12);color:#9333ea}
.hp-HIGH{background:rgba(224,62,62,.1);color:var(--red)}
.hp-ELEVATED{background:rgba(212,135,15,.12);color:var(--gold)}
.hp-MONITORING{background:rgba(0,180,216,.1);color:var(--cyan)}
.pzone-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pm{background:var(--bg);border-radius:var(--rsm);padding:8px;text-align:center}
.pm-val{font-family:var(--mono);font-size:.92rem;font-weight:700;color:var(--text);display:block}
.pm-lbl{font-size:.6rem;color:var(--text3);font-weight:500}
.pzone-chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.domain-chip{font-family:var(--mono);font-size:.56rem;padding:2px 7px;border-radius:var(--rpill);background:var(--bg);border:1px solid var(--border);color:var(--text3);text-transform:uppercase}
.event-chip{font-size:.63rem;padding:2px 8px;border-radius:var(--rpill);background:rgba(224,62,62,.07);border:1px solid rgba(224,62,62,.15);color:var(--red)}

/* ── NEXUS BRIEF ── */
.nexus{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow-lg);animation:cin .35s ease both}
.nexus-topbar{height:5px;background:linear-gradient(90deg,#6b4fbb,#00b4d8,#0da86a)}
.nexus-inner{padding:18px}
.nexus-eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nexus-label{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.nexus-time{font-family:var(--mono);font-size:.6rem;color:var(--text4)}
.nexus-title{font-family:var(--serif);font-style:italic;font-size:1.28rem;font-weight:700;line-height:1.3;color:var(--text);margin-bottom:12px}
.nexus-synthesis{font-size:.88rem;line-height:1.7;color:var(--text2);margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.nexus-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;align-items:center}
.nchip{font-family:var(--mono);font-size:.6rem;font-weight:600;padding:3px 10px;border-radius:var(--rpill);border:1.5px solid}
.tier-pill{font-family:var(--mono);font-size:.58rem;font-weight:700;padding:3px 9px;border-radius:var(--rpill);text-transform:uppercase}
.tier-early{background:rgba(224,62,62,.1);color:var(--red)}
.tier-developing{background:rgba(212,135,15,.12);color:var(--gold)}
.tier-confirmed{background:rgba(13,168,106,.1);color:var(--green)}
.tier-high{background:rgba(0,180,216,.1);color:var(--cyan)}
.nexus-fields{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.nfield{background:var(--bg);border-radius:var(--rsm);padding:11px 13px;border-left:3px solid var(--border2)}
.nfield.so-what{border-left-color:var(--cyan);background:var(--cyan-bg)}
.nfield.who{border-left-color:var(--purple)}
.nfield.timeline{border-left-color:var(--gold)}
.nfield.precedent{border-left-color:var(--orange)}
.nfield.next-steps{border-left-color:var(--green)}
.nfield.watch{border-left-color:var(--red)}
.nf-lbl{font-family:var(--mono);font-size:.56rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text4);margin-bottom:4px}
.nf-body{font-size:.83rem;line-height:1.6;color:var(--text2)}
.nfield.so-what .nf-body{color:var(--text);font-weight:500}
.nexus-footer{padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nfm{display:flex;gap:4px;align-items:baseline}
.nfm-lbl{font-family:var(--mono);font-size:.56rem;color:var(--text4);letter-spacing:.06em;text-transform:uppercase}
.nfm-val{font-family:var(--mono);font-size:.73rem;font-weight:600}
.nuncert{font-size:.68rem;color:var(--text4);font-style:italic}
.trigger-tag{font-family:var(--mono);font-size:.56rem;padding:2px 7px;border-radius:4px;background:var(--purple-bg);color:var(--purple);border:1px solid rgba(107,79,187,.2);margin-left:auto}

/* ── INTRO BANNERS ── */
.intro-banner{border-radius:var(--r);border:1px solid;padding:14px;margin-bottom:13px;text-align:center}
.ib-title{font-family:var(--serif);font-style:italic;font-size:.95rem;margin-bottom:5px}
.ib-body{font-size:.75rem;line-height:1.6;max-width:460px;margin:0 auto}

/* ── LOADING / EMPTY ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 16px;gap:12px}
.ldots{display:flex;gap:5px}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:db 1.2s ease-in-out infinite}
.ldot:nth-child(2){animation-delay:.15s}.ldot:nth-child(3){animation-delay:.3s}
@keyframes db{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.ltxt{font-size:.77rem;color:var(--text3);font-family:var(--mono);letter-spacing:.06em}
.empty-s{text-align:center;padding:36px 16px}
.ei{font-size:2.5rem;margin-bottom:9px;opacity:.3}
.et{font-size:.78rem;color:var(--text3);font-family:var(--mono);letter-spacing:.04em}
.load-more{display:block;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;margin-top:4px;box-shadow:var(--shadow)}
.load-more:hover{background:var(--bg);border-color:var(--border2);color:var(--cyan)}

/* ── DARK MODE ── */
body.dark{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#21262d;--border2:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--text4:#484f58}

/* ── SSE LIVE INDICATOR ── */
.live-dot{width:8px;height:8px;border-radius:50%;background:#e03e3e;flex-shrink:0;transition:background .4s}
.live-dot.connected{background:var(--green);animation:pulse-dot 2.5s ease-in-out infinite}
.live-label{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.07em;color:var(--text3);text-transform:uppercase}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(13,168,106,.5)}50%{box-shadow:0 0 0 4px rgba(13,168,106,0)}}

/* ── AUTH MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);width:100%;max-width:380px;box-shadow:var(--shadow-lg);transform:translateY(12px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-head{padding:20px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-weight:700;font-size:1rem}
.modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;font-size:.9rem;color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px}
.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:.72rem;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.mfield input{width:100%;border:1px solid var(--border);border-radius:var(--rsm);padding:9px 12px;font-family:var(--sans);font-size:.85rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.mfield input:focus{border-color:var(--cyan);background:var(--surface)}
.mbtn{width:100%;padding:10px;border-radius:var(--rsm);background:var(--cyan);color:#fff;border:none;font-family:var(--sans);font-weight:600;font-size:.85rem;cursor:pointer;transition:opacity .15s;margin-top:4px}
.mbtn:hover{opacity:.88}
.mbtn.secondary{background:var(--surface);color:var(--text2);border:1px solid var(--border);margin-top:8px}
.merr{font-size:.75rem;color:var(--red);margin-top:6px;min-height:1em}
.msucc{font-size:.75rem;color:var(--green);margin-top:6px}
.mtabs{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--border);border-radius:var(--rsm);overflow:hidden}
.mtab{flex:1;padding:7px;border:none;background:none;font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--text3);cursor:pointer;transition:all .15s}
.mtab.active{background:var(--cyan);color:#fff}

/* ── USER BADGE ── */
.user-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--rpill);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.74rem;font-weight:500;color:var(--text2);transition:all .15s}
.user-badge:hover{border-color:var(--cyan);color:var(--cyan)}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--cyan);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ── WATCHLIST PANEL ── */
.wl-panel{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.wl-title{font-weight:700;font-size:.9rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.wl-row{margin-bottom:12px}

.wl-row input{width:100%;border:1px solid var(--border);border-radius:var(--rsm);padding:7px 11px;font-family:var(--sans);font-size:.8rem;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s}
.wl-row input:focus{border-color:var(--cyan)}
.wl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.wl-tag{display:inline-flex;align-items:center;gap:4px;background:var(--cyan-bg);color:var(--cyan);border:1px solid rgba(0,180,216,.2);border-radius:var(--rpill);padding:3px 9px;font-size:.7rem;font-weight:500}
.wl-tag button{background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--cyan);padding:0;line-height:1;opacity:.7}
.wl-tag button:hover{opacity:1}
.wl-save{background:var(--cyan);color:#fff;border:none;border-radius:var(--rsm);padding:8px 16px;font-family:var(--sans);font-weight:600;font-size:.78rem;cursor:pointer;transition:opacity .15s}
.wl-save:hover{opacity:.88}

/* ── RETRO SCORING TAB ── */
.retro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.retro-stat{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px;box-shadow:var(--shadow);text-align:center}
.retro-stat .rs-val{font-family:var(--mono);font-size:1.6rem;font-weight:700;line-height:1;margin-bottom:4px}
.retro-stat .rs-lbl{font-size:.62rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.retro-outcome-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);border-left:4px solid var(--border);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.retro-outcome-card.validated{border-left-color:var(--green)}
.retro-outcome-card.invalidated{border-left-color:var(--red)}
.retro-outcome-card.partial{border-left-color:var(--gold)}
.retro-outcome-card.pending{border-left-color:var(--border2);opacity:.7}
.roc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.roc-title{font-size:.82rem;font-weight:600;color:var(--text)}
.roc-outcome{font-family:var(--mono);font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:var(--rpill)}
.roc-outcome.validated{background:var(--green-bg);color:var(--green)}
.roc-outcome.invalidated{background:var(--red-bg);color:var(--red)}
.roc-outcome.partial{background:var(--gold-bg);color:var(--gold)}
.roc-outcome.pending{background:var(--surface2);color:var(--text3)}
.roc-notes{font-size:.75rem;color:var(--text3);margin-top:4px}
.tier-table{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.tier-table-row{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.78rem}
.tier-table-row:last-child{border-bottom:none}
.tier-table-head{background:var(--surface2);font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}

/* ── AGENT TRACE PANEL ── */
.trace-panel{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.trace-header{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between}
.trace-agent-name{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px}
.trace-meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.trace-meta-cell{background:var(--surface);padding:11px 14px;text-align:center}
.tmc-val{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--text)}
.tmc-lbl{font-size:.62rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-top:2px}
.trace-runs{padding:14px 16px}
.trace-run-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.75rem}
.trace-run-row:last-child{border-bottom:none}
.run-status{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.run-status.success{background:var(--green)}
.run-status.error{background:var(--red)}
.run-found{font-family:var(--mono);color:var(--text3)}
.run-time{margin-left:auto;color:var(--text4);font-family:var(--mono);font-size:.68rem}
.trace-domain{font-size:.74rem;color:var(--text2);padding:0 16px 14px;line-height:1.55}
.agent-sel{background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm);padding:7px 10px;font-family:var(--sans);font-size:.8rem;color:var(--text);outline:none;cursor:pointer;width:100%;margin-bottom:12px}
</style>
</head>

/* ── HELPERS ── */
function ago(ts){if(!ts)return'—';const s=(Date.now()-new Date(ts))/1000;if(s<60)return`${~~s}s ago`;if(s<3600)return`${~~(s/60)}m ago`;if(s<86400)return`${~~(s/3600)}h ago`;return`${~~(s/86400)}d ago`}
function cc(c){if(c>=.65)return'var(--green)';if(c>=.4)return'var(--gold)';return'var(--red)'}
function san(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function da(v){if(Array.isArray(v))return v;if(typeof v==='string'&&v){try{const r=JSON.parse(v);return Array.isArray(r)?r:[]}catch(e){return[]}}return[]}
function tc(t){if(!t)return'tier-early';const l=t.toLowerCase();if(l.includes('high'))return'tier-high';if(l.includes('confirm'))return'tier-confirmed';if(l.includes('develop'))return'tier-developing';return'tier-early'}

/* ── ANALYST BAR ── */
function buildAbar(){
  const c=document.getElementById('abar');
  const names=['ALL',...Object.keys(AM)];
  c.innerHTML=names.map(n=>{
    const a=AM[n];
    const cnt=n==='ALL'?posts.length:(activity[n]||0);
    const ia=n===activeAna;
    const col=a?a.c:'#8a96a3';
    return`<div class="av-wrap" onclick="filterBy('${n}')">
      <div class="av${ia?' active':''}" style="${ia?`border-color:${col};box-shadow:0 0 0 3px ${col}22`:''}">${a?a.e:'🌐'}</div>
      <span class="av-name" style="${ia?`color:${col}`:'font-size:.58rem'}">${n==='ALL'?'All':n}</span>
      <span class="av-cnt">${cnt||'—'}</span>
    </div>`;
  }).join('');
}

/* ── SIGNAL CARD ── */
function renderCard(p){
  const n=p.analyst||'UNKNOWN';
  const m=AM[n]||{e:'◯',c:'#8a96a3',b:'rgba(138,150,163,.1)',d:'Intelligence'};
  const type=(p.type||'signal').toLowerCase();
  const conf=parseFloat(p.confidence||0);
  const tags=da(p.tags).slice(0,5);
  const srcs=parseInt(p.source_count||1);
  return`<div class="card" style="border-left-color:${m.c}">
    <div class="ctop">
      <div class="cav" style="border-color:${m.c};background:${m.b}">${m.e}</div>
      <div class="cmeta">
        <div class="cmeta-top">
          <span class="cname" style="color:${m.c}">${san(n)}</span>
          <span class="cpill pill-${type}">${type.charAt(0).toUpperCase()+type.slice(1)}</span>
          <span class="ctime">${ago(p.timestamp)}</span>
        </div>
        <div class="cdomain">${san(m.d)}</div>
      </div>
    </div>
    <div class="cbody">${san(p.body||'')}</div>
    <div class="cfoot">
      <div class="cbar-wrap"><div class="cbar"><div class="cfill" style="width:${Math.round(conf*100)}%;background:${cc(conf)}"></div></div><span class="cpct" style="color:${cc(conf)}">${Math.round(conf*100)}%</span></div>
      <span class="csrc">· ${srcs} src${srcs!==1?'s':''}</span>
      <div class="ctags">${tags.map(t=>`<span class="tag">${san(t)}</span>`).join('')}</div>
    </div>
  </div>`;
}

/* ── GRID CARD ── */
function renderCluster(c){
  const analysts=da(c.analysts);
  const samples=da(c.sample_signals);
  const etype=c.entity_type||'';
  const sev=c.max_severity||'LOW';
  const chips=analysts.map(a=>{const m=AM[a];const col=m?m.c:'#8a96a3';return`<span class="gchip" style="color:${col};border-color:${col};background:${col}18">${san(a)}</span>`}).join('');
  return`<div class="gcard">
    <div class="gcard-top">
      <div class="gcard-entity">
        <span class="gcard-type etype-${etype}">${san(etype.replace(/_/g,' '))}</span>
        <span class="gcard-val">${san(c.entity_value||'')}</span>
      </div>
      <span class="gcard-score">↑ ${(c.corroboration_score||0).toFixed(1)}</span>
    </div>
    <div class="gcard-analysts">${chips}</div>
    <div class="gcard-signals">${samples.slice(0,2).map(s=>`<div class="gsig">${san(s)}</div>`).join('')}</div>
    <div class="gcard-meta">
      <span class="gcard-stat">${c.analyst_count} analysts · ${c.mention_count} signals</span>
      <span class="sev-pill sev-${sev}">${san(sev)}</span>
      <span class="gcard-stat">${ago(c.timestamp)}</span>
    </div>
  </div>`;
}

/* ── PRESSURE CARD ── */
function renderZone(z){
  const heat=z.heat_level||'MONITORING';
  const domains=da(z.domains);
  const events=da(z.event_types);
  const sectors=da(z.sectors);
  return`<div class="pzone">
    <div class="pzone-bar heat-${heat}"></div>
    <div class="pzone-body">
      <div class="pzone-top">
        <div>
          <div class="pzone-geo">${san(z.geography)}</div>
          ${sectors.length?`<div class="pzone-sub">${sectors.slice(0,3).map(s=>san(s)).join(' · ')}</div>`:''}
        </div>
        <span class="heat-pill hp-${heat}">${san(heat)}</span>
      </div>
      <div class="pzone-metrics">
        <div class="pm"><span class="pm-val">${(z.pressure_score||0).toFixed(1)}</span><span class="pm-lbl">Pressure</span></div>
        <div class="pm"><span class="pm-val">${(z.velocity_score||0).toFixed(1)}x</span><span class="pm-lbl">Velocity</span></div>
        <div class="pm"><span class="pm-val">${Math.round((z.domain_diversity||0)*100)}%</span><span class="pm-lbl">Domain Div.</span></div>
      </div>
      ${domains.length?`<div class="pzone-chips">${domains.map(d=>`<span class="domain-chip">${san(d)}</span>`).join('')}</div>`:''}
      ${events.length?`<div class="pzone-chips">${events.slice(0,5).map(e=>`<span class="event-chip">${san(e)}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

/* ── NEXUS BRIEF ── */
function renderNexus(b){
  const analysts=da(b.analysts_involved);
  const conf=parseFloat(b.confidence||0.5);
  const conv=parseFloat(b.convergence_score||0.5);
  const tier=b.confidence_tier||'EARLY WARNING';
  const chips=analysts.map(a=>{const m=AM[a];const c=m?m.c:'#8a96a3';return`<span class="nchip" style="color:${c};border-color:${c};background:${c}15">${san(a)}</span>`}).join('');
  const fields=[
    b.so_what?`<div class="nfield so-what"><div class="nf-lbl">▸ So What</div><div class="nf-body">${san(b.so_what)}</div></div>`:'',
    b.who_affected?`<div class="nfield who"><div class="nf-lbl">▸ Who's Affected</div><div class="nf-body">${san(b.who_affected)}</div></div>`:'',
    b.timeline?`<div class="nfield timeline"><div class="nf-lbl">▸ Timeline</div><div class="nf-body">${san(b.timeline)}</div></div>`:'',
    b.historical_precedent?`<div class="nfield precedent"><div class="nf-lbl">▸ Historical Precedent</div><div class="nf-body">${san(b.historical_precedent)}</div></div>`:'',
    b.next_steps?`<div class="nfield next-steps"><div class="nf-lbl">▸ Next Steps</div><div class="nf-body">${san(b.next_steps)}</div></div>`:'',
    b.what_to_watch?`<div class="nfield watch"><div class="nf-lbl">▸ What to Watch</div><div class="nf-body">${san(b.what_to_watch)}</div></div>`:'',
  ].filter(Boolean).join('');
  return`<div class="nexus">
    <div class="nexus-topbar"></div>
    <div class="nexus-inner">
      <div class="nexus-eyebrow">
        <span class="nexus-label">◆ NEXUS Brief · The Desk</span>
        <span class="nexus-time">${ago(b.timestamp)}</span>
      </div>
      <div class="nexus-title">${san(b.title||'Intelligence Brief')}</div>
      <div class="nexus-synthesis">${san(b.synthesis||b.body||'')}</div>
      <div class="nexus-chips">${chips}<span class="tier-pill ${tc(tier)}">${san(tier)}</span></div>
      ${fields?`<div class="nexus-fields">${fields}</div>`:''}
      <div class="nexus-footer">
        <div class="nfm"><span class="nfm-lbl">Conv.</span><span class="nfm-val" style="color:var(--purple)">${Math.round(conv*100)}%</span></div>
        <div class="nfm"><span class="nfm-lbl">Confidence</span><span class="nfm-val" style="color:${cc(conf)}">${Math.round(conf*100)}%</span></div>
        ${b.uncertainty_notes?`<span class="nuncert">⚠ ${san(b.uncertainty_notes)}</span>`:''}
        <span class="trigger-tag">${san((b.trigger_type||'convergence').replace(/_/g,' '))}</span>
      </div>
    </div>
  </div>`;
}

/* ── RENDER PANES ── */
function renderWire(){
  const fp=activeAna==='ALL'?posts:posts.filter(p=>p.analyst===activeAna);
  const fq=searchQ?fp.filter(p=>(p.body||'').toLowerCase().includes(searchQ)||(da(p.tags)).some(t=>t.toLowerCase().includes(searchQ))):fp;
  const el=document.getElementById('pane-wire');
  if(!fq.length){el.innerHTML=`<div class="empty-s"><div class="ei">📡</div><div class="et">No signals match this filter</div></div>`;return}
  el.innerHTML=fq.slice(0,PAGE).map(renderCard).join('')+(fq.length>PAGE?`<button class="load-more" onclick="loadMoreWire()">Load more signals</button>`:'');
}

/* ── TABS ── */
function switchTab(name,btn){
  ['wire','grid','pressure','nexus'].forEach(t=>{document.getElementById(`pane-${t}`).style.display=t===name?'block':'none'});
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset&&b.dataset.tab===name));
  if(name==='wire')renderWire();
  if(name==='grid')renderGrid();
  if(name==='pressure')renderPressure();
  if(name==='nexus')renderNexusPane();
}

function filterBy(n){activeAna=n;buildAbar();renderWire();['grid','pressure','nexus'].forEach(t=>{document.getElementById(`pane-${t}`).style.display='none'});document.querySelectorAll('.tab').forEach(b=>{if(b.dataset&&b.dataset.tab)b.classList.toggle('active',b.dataset.tab==='wire')});renderWire()}
function onSearch(v){searchQ=v.trim().toLowerCase();renderWire()}
function loadMoreWire(){const fp=activeAna==='ALL'?posts:posts.filter(p=>p.analyst===activeAna);const el=document.getElementById('pane-wire');const ex=el.querySelectorAll('.card').length;const next=fp.slice(ex,ex+PAGE).map(renderCard).join('');const btn=el.querySelector('.load-more');if(btn)btn.insertAdjacentHTML('beforebegin',next);if(ex+PAGE>=fp.length&&btn)btn.remove()}

/* ── LIVE DATA (when backend available) ── */
async function fetchLive(){
  if(DEMO)return;
  try{
    const [pr,gr,pz,br]=await Promise.all([
      fetch(`${API}/api/posts?limit=120`).then(r=>r.json()),
      fetch(`${API}/api/grid`).then(r=>r.json()),
      fetch(`${API}/api/pressure`).then(r=>r.json()),
      fetch(`${API}/api/briefs?limit=20`).then(r=>r.json()),
    ]);
    posts=(pr.posts||[]).map(p=>{['tags','source_urls','facts'].forEach(f=>{if(typeof p[f]==='string'){try{p[f]=JSON.parse(p[f])}catch(e){p[f]=[]}}});return p});
    clusters=gr.clusters||[];
    zones=pz.zones||[];
    briefs=(br.briefs||[]).map(b=>{['analysts_involved'].forEach(f=>{if(typeof b[f]==='string'){try{b[f]=JSON.parse(b[f])}catch(e){b[f]=[]}}});return b});
    const sr=await fetch(`${API}/api/stats`).then(r=>r.json());
    activity=sr.analyst_activity||{};
    updateSysbar();buildAbar();
    const ct=document.querySelector('.tab.active');
    if(ct&&ct.dataset)switchTab(ct.dataset.tab,ct);
  }catch(e){console.log('Backend not available — using demo data')}
}

  const errEl=document.getElementById('authErr');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='Email and password required.';return;}
  if(authMode==='register'&&pass.length<8){errEl.textContent='Password must be 8+ characters.';return;}
  try{
    const endpoint=authMode==='login'?'/api/auth/login':'/api/auth/register';
    const res=await fetch(`${API}${endpoint}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const data=await res.json();
    if(!res.ok){errEl.textContent=data.error||'Authentication failed.';return;}
    authToken=data.token;authUser=data.user;
    localStorage.setItem('ao_token',authToken);localStorage.setItem('ao_user',JSON.stringify(authUser));
    document.getElementById('authModal').classList.remove('open');
    updateAuthUI();
    fetchLive();
  }catch(e){errEl.textContent='Network error — is the backend running?';}
}
function logOut(){
  authToken=null;authUser=null;
  localStorage.removeItem('ao_token');localStorage.removeItem('ao_user');
  updateAuthUI();
}
function updateAuthUI(){
  const wrap=document.getElementById('authBtnWrap');
  if(authUser){
    const initials=(authUser.email||'?').substring(0,1).toUpperCase();
    wrap.innerHTML=`<div class="user-badge" onclick="logOut()" title="Click to log out"><div class="user-avatar">${initials}</div><span>${san(authUser.email.split('@')[0])}</span></div>`;
  }else{
    wrap.innerHTML=`<div class="ibtn" onclick="openAuthModal()" title="Sign in">👤</div>`;
  }
}
function authedHeaders(){return authToken?{'Authorization':`Bearer ${authToken}`,'Content-Type':'application/json'}:{'Content-Type':'application/json'};}

/* ══════════════════════════════════════════════════════
   WATCHLIST PANE
══════════════════════════════════════════════════════ */
let watchlist={countries:[],sectors:[],analysts:[]};
let watchlistFeed=[];

async function loadWatchlist(){
  if(!authToken)return;
  try{
    const r=await fetch(`${API}/api/watchlist`,{headers:authedHeaders()});
    if(r.ok){watchlist=await r.json();}
  }catch(e){}
}
async function saveWatchlist(){
  if(!authToken){document.getElementById('wlStatus').textContent='Sign in to save watchlists.';return;}
  try{
    const r=await fetch(`${API}/api/watchlist`,{method:'PUT',headers:authedHeaders(),body:JSON.stringify(watchlist)});
    if(r.ok){document.getElementById('wlStatus').textContent='Saved ✓';setTimeout(()=>{const el=document.getElementById('wlStatus');if(el)el.textContent='';},2500);}
  }catch(e){}
}
async function fetchWatchlistFeed(){
  if(!authToken)return;
  try{
    const r=await fetch(`${API}/api/watchlist/feed`,{headers:authedHeaders()});
    if(r.ok){const d=await r.json();watchlistFeed=d.posts||[];}
  }catch(e){}
}

function addWlTag(field,val){
  val=val.trim();
  if(!val)return;
  if(!watchlist[field].includes(val))watchlist[field]=[...watchlist[field],val];
  renderWatchlistPane();
}
function removeWlTag(field,val){watchlist[field]=watchlist[field].filter(v=>v!==val);renderWatchlistPane();}

function renderWatchlistPane(){
  const el=document.getElementById('pane-watchlist');
  if(!authUser){
    el.innerHTML=`<div class="wl-panel"><div class="wl-title">⭐ Personalised Watchlist</div><p style="font-size:.8rem;color:var(--text3);margin-bottom:12px">Sign in to create a personalised intelligence feed filtered to your countries, sectors, and analysts.</p><button class="mbtn" style="max-width:200px" onclick="openAuthModal()">Sign In</button></div>`;
    return;
  }
  const mkTags=(field,label)=>{
    const tags=watchlist[field]||[];
    return`<div class="wl-row">
      <label>${label}</label>
      <div style="display:flex;gap:6px">
        <input type="text" id="wl-input-${field}" placeholder="Add ${label.toLowerCase()}…" onkeydown="if(event.key==='Enter'){addWlTag('${field}',this.value);this.value=''}"/>
        <button class="wl-save" style="padding:6px 12px;flex-shrink:0" onclick="addWlTag('${field}',document.getElementById('wl-input-${field}').value);document.getElementById('wl-input-${field}').value=''">+</button>
      </div>
      <div class="wl-tags">${tags.map(t=>`<span class="wl-tag">${san(t)}<button onclick="removeWlTag('${field}','${t}')">✕</button></span>`).join('')}</div>
    </div>`;
  };

  const feedHtml=watchlistFeed.length?watchlistFeed.slice(0,30).map(renderCard).join(''):
    `<div class="empty-s"><div class="ei">⭐</div><div class="et">No matching signals yet. Add countries or sectors above.</div></div>`;

  el.innerHTML=`
    <div class="wl-panel">
      <div class="wl-title">⭐ My Intelligence Feed</div>
      ${mkTags('countries','Countries')}
      ${mkTags('sectors','Sectors')}
      ${mkTags('analysts','Analysts')}
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
        <button class="wl-save" onclick="saveWatchlist();fetchWatchlistFeed().then(renderWatchlistPane)">Save & Refresh Feed</button>
        <span id="wlStatus" style="font-size:.75rem;color:var(--green)"></span>
      </div>
    </div>
    <div style="margin-bottom:8px;font-family:var(--mono);font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em">Filtered Feed (${watchlistFeed.length} signals)</div>
    ${feedHtml}`;
}

/* ══════════════════════════════════════════════════════
   RETROSPECTIVE SCORING PANE
══════════════════════════════════════════════════════ */
let retroData={overall:{hit_rate:null,total_resolved:0,total_pending:0},by_confidence_tier:{},recent_outcomes:[]};

async function fetchRetro(){
  if(DEMO){renderRetroPane();return;}
  try{
    const r=await fetch(`${API}/api/retro/summary`);
    if(r.ok)retroData=await r.json();
  }catch(e){}
  renderRetroPane();
}

function renderRetroPane(){
  const el=document.getElementById('pane-retro');
  const o=retroData.overall||{};
  const tiers=retroData.by_confidence_tier||{};
  const recent=retroData.recent_outcomes||[];

  const hitPct=o.hit_rate!=null?`${Math.round(o.hit_rate*100)}%`:'—';
  const hitColor=o.hit_rate==null?'var(--text3)':o.hit_rate>=0.7?'var(--green)':o.hit_rate>=0.45?'var(--gold)':'var(--red)';

  // Tier table rows
  const TIER_ORDER=['CONFIRMED','HIGH CONFIDENCE','DEVELOPING','EARLY WARNING'];
  const tierRows=TIER_ORDER.map(tier=>{
    const d=tiers[tier];
    if(!d)return'';
    const pct=d.hit_rate!=null?`${Math.round(d.hit_rate*100)}%`:'—';
    const col=d.hit_rate==null?'var(--text3)':d.hit_rate>=0.7?'var(--green)':d.hit_rate>=0.45?'var(--gold)':'var(--red)';
    return`<div class="tier-table-row">
      <span>${san(tier)}</span>
      <span style="font-family:var(--mono);font-weight:700;color:${col}">${pct}</span>
      <span style="font-family:var(--mono);color:var(--green)">${d.validated||0}✓</span>
      <span style="font-family:var(--mono);color:var(--text3)">${d.total_resolved||0} resolved</span>
    </div>`;
  }).filter(Boolean).join('');

  // Recent outcomes
  const outcomeCards=recent.length?recent.slice(0,8).map(r=>{
    const outcome=r.outcome||'pending';
    return`<div class="retro-outcome-card ${outcome}">
      <div class="roc-top">
        <span class="roc-title">${san(r.brief_id?.substring(0,12)||'Brief')}…</span>
        <span class="roc-outcome ${outcome}">${outcome.toUpperCase()}</span>
      </div>
      ${r.notes?`<div class="roc-notes">${san(r.notes)}</div>`:''}
      ${r.confidence_tier?`<div style="margin-top:4px;font-size:.68rem;color:var(--text3)">${san(r.confidence_tier)}</div>`:''}
    </div>`;
  }).join(''):
  `<div class="empty-s"><div class="ei">📊</div><div class="et">No outcomes recorded yet. Validate SITREPs via the admin API: POST /api/retro/outcomes</div></div>`;

  el.innerHTML=`
    <div class="intro-banner" style="background:var(--green-bg);border-color:rgba(13,168,106,.15)">
      <div class="ib-title" style="color:var(--green)">Retrospective Accuracy Engine</div>
      <div class="ib-body" style="color:var(--text2)">Every NEXUS Brief outcome is logged — validated when the predicted event occurs, invalidated when it doesn't. This closes the feedback loop and proves the system's predictive validity. hit_rate = (validated + partial×0.5) / all resolved.</div>
    </div>

    <div class="retro-grid">
      <div class="retro-stat"><div class="rs-val" style="color:${hitColor}">${hitPct}</div><div class="rs-lbl">Overall Hit Rate</div></div>
      <div class="retro-stat"><div class="rs-val" style="color:var(--cyan)">${o.total_resolved||0}</div><div class="rs-lbl">Resolved Briefs</div></div>
      <div class="retro-stat"><div class="rs-val" style="color:var(--green)">${o.validated||0}</div><div class="rs-lbl">Validated</div></div>
      <div class="retro-stat"><div class="rs-val" style="color:var(--text3)">${o.total_pending||0}</div><div class="rs-lbl">Pending</div></div>
    </div>

    ${tierRows?`
    <div style="font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Hit Rate by Confidence Tier</div>
    <div class="tier-table">
      <div class="tier-table-row tier-table-head"><span>Tier</span><span>Hit Rate</span><span>Validated</span><span>Resolved</span></div>
      ${tierRows}
    </div>`:''}

    <div style="font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Recent Outcomes</div>
    ${outcomeCards}`;
}

/* ══════════════════════════════════════════════════════
   AGENT TRACE PANE
══════════════════════════════════════════════════════ */
let traceAgent=null;
let traceData={};
const ALL_AGENTS=['STONE','VOSS','MARA','REED','ATLAS','WATT','TIDE','ECHO','LEX','FINN','CARGO','TERRA','DELPHI','GHOST','GRID','PRESSURE','DESK'];

async function fetchTrace(name){
  if(DEMO){renderTraceData({agent:name,display_name:name,personality:'Demo mode — connect backend to see live trace.',domain_context:'',interval_minutes:30,meta:{total_runs:0,success_rate:null,total_items_fetched:0,total_posts_saved:0},recent_runs:[],recent_posts:[]});return;}
  const adminKey=prompt('Admin key:');
  if(!adminKey)return;
  try{
    const r=await fetch(`${API}/api/agents/${name}/trace`,{headers:{'X-Admin-Key':adminKey}});
    if(r.ok){traceData=await r.json();renderTraceData(traceData);}
    else{document.getElementById('traceResult').innerHTML=`<div class="empty-s"><div class="ei">🔒</div><div class="et">Invalid admin key or agent not found.</div></div>`;}
  }catch(e){console.warn('Trace fetch failed',e);}
}

function renderTracePane(){
  const el=document.getElementById('pane-trace');
  const opts=ALL_AGENTS.map(a=>`<option value="${a}"${a===traceAgent?'selected':''}>${a}</option>`).join('');
  el.innerHTML=`
    <div class="intro-banner" style="background:var(--navy-bg);border-color:rgba(29,78,216,.15)">
      <div class="ib-title" style="color:var(--navy)">Agent Observability Trace</div>
      <div class="ib-body" style="color:var(--text2)">Full execution trace per agent: run history, success rate, items fetched vs posted, domain context, and recent intelligence output. Requires admin key.</div>
    </div>
    <select class="agent-sel" id="agentSel" onchange="traceAgent=this.value">${opts}</select>
    <button class="wl-save" style="margin-bottom:14px;background:var(--navy)" onclick="traceAgent=document.getElementById('agentSel').value;fetchTrace(traceAgent)">Load Trace</button>
    <div id="traceResult">${traceData.agent?renderTraceDataHtml(traceData):''}</div>`;
}

function renderTraceData(data){
  traceData=data;
  const el=document.getElementById('traceResult');
  if(el)el.innerHTML=renderTraceDataHtml(data);
}

function renderTraceDataHtml(data){
  const m=data.meta||{};
  const runs=(data.recent_runs||[]).slice(0,10);
  const posts=(data.recent_posts||[]).slice(0,5);
  const successPct=m.success_rate!=null?`${Math.round(m.success_rate*100)}%`:'—';
  const effPct=m.efficiency_rate!=null?`${Math.round(m.efficiency_rate*100)}%`:'—';

  const runRows=runs.length?runs.map(r=>{
    const status=r.status||'unknown';
    return`<div class="trace-run-row">
      <div class="run-status ${status}"></div>
      <span style="color:var(--text2);font-size:.75rem">${status}</span>
      <span class="run-found">${r.items_found||0} fetched → ${r.items_posted||0} posted</span>
      ${r.error?`<span style="color:var(--red);font-size:.7rem">${san(r.error)}</span>`:''}
      <span class="run-time">${ago(r.completed_at||r.started_at)}</span>
    </div>`;
  }).join(''):
  `<div style="font-size:.75rem;color:var(--text3);padding:8px 0">No runs recorded yet.</div>`;

  const postCards=posts.length?posts.map(p=>`<div style="border-bottom:1px solid var(--border);padding:10px 0;font-size:.78rem;color:var(--text2)"><div style="font-weight:600;color:var(--text);margin-bottom:3px">${san((p.body||'').substring(0,80))}…</div><span style="font-family:var(--mono);font-size:.65rem;color:var(--text3)">${ago(p.timestamp)} · conf ${Math.round((p.confidence||0)*100)}%</span></div>`).join(''):
  `<div style="font-size:.75rem;color:var(--text3)">No recent posts.</div>`;

  return`<div class="trace-panel">
    <div class="trace-header">
      <div class="trace-agent-name">${san(data.display_name||data.agent)} <span style="font-size:.7rem;font-weight:400;color:var(--text3)">every ${data.interval_minutes}min</span></div>
    </div>
    <div class="trace-meta-grid">
      <div class="trace-meta-cell"><div class="tmc-val">${m.total_runs||0}</div><div class="tmc-lbl">Total Runs</div></div>
      <div class="trace-meta-cell"><div class="tmc-val" style="color:${m.success_rate>=0.9?'var(--green)':'var(--gold)'}">${successPct}</div><div class="tmc-lbl">Success Rate</div></div>
      <div class="trace-meta-cell"><div class="tmc-val" style="color:var(--cyan)">${effPct}</div><div class="tmc-lbl">Post Efficiency</div></div>
    </div>
    ${data.domain_context?`<div class="trace-domain">${san(data.domain_context)}</div>`:''}
    ${data.personality?`<div class="trace-domain" style="font-style:italic;color:var(--text3)">"${san(data.personality)}"</div>`:''}
    <div class="trace-runs">
      <div style="font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Recent Runs</div>
      ${runRows}
    </div>
    <div class="trace-runs" style="border-top:1px solid var(--border)">
      <div style="font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Recent Posts</div>
      ${postCards}
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════
   SSE LIVE FEED
══════════════════════════════════════════════════════ */
let sseConn=null;
function connectSSE(){
  if(DEMO||sseConn)return;
  try{
    sseConn=new EventSource(`${API}/api/stream`);
    sseConn.addEventListener('connected',()=>{
      document.getElementById('liveDot').classList.add('connected');
      document.getElementById('liveLabel').textContent='live';
    });
    sseConn.addEventListener('agent_run',e=>{
      const d=JSON.parse(e.data);
      // Flash the analyst avatar
      const avEl=document.querySelector(`.av-wrap[data-agent="${d.agent}"] .av`);
      if(avEl){avEl.style.boxShadow='0 0 0 4px rgba(0,180,216,.4)';setTimeout(()=>{avEl.style.boxShadow='';},1500);}
      // Silently refresh data
      fetchLive();
    });
    sseConn.addEventListener('stats_update',e=>{
      const d=JSON.parse(e.data);
      if(d.analyst_activity)activity=d.analyst_activity;
      updateSysbar();
    });
    sseConn.onerror=()=>{
      document.getElementById('liveDot').classList.remove('connected');
      document.getElementById('liveLabel').textContent='offline';
      sseConn=null;
      setTimeout(connectSSE,15000); // Reconnect in 15s
    };
  }catch(e){}
}

/* ── INIT ── */
updateSysbar();
buildAbar();
renderWire();
updateAuthUI();
if(authToken)loadWatchlist();
connectSSE();
setInterval(()=>{if(!DEMO)fetchLive();},120000);
</script>
